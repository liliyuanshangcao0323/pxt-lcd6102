<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模块加载测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #2c3e50;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .status {
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
        }
        .status-warning {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .log {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>
    <h1>认证模块加载测试</h1>
    
    <div class="test-section">
        <h2>1. 模块加载状态检查</h2>
        <div id="module-status" class="status status-warning">检查中...</div>
        <button onclick="checkModuleStatus()">再次检查</button>
    </div>
    
    <div class="test-section">
        <h2>2. 认证模块功能测试</h2>
        <div id="auth-function-status" class="status status-warning">未测试</div>
        <button onclick="testAuthFunctionality()">运行测试</button>
    </div>
    
    <div class="test-section">
        <h2>3. 加载器初始化验证</h2>
        <div id="loader-validation-status" class="status status-warning">未验证</div>
        <button onclick="validateModuleLoader()">验证加载器</button>
    </div>
    
    <div class="test-section">
        <h2>详细日志</h2>
        <div id="log-output" class="log">准备开始记录...</div>
    </div>
    
    <!-- 加载测试所需的核心模块 -->
    <!-- 独立测试，不依赖其他模块 -->
    <script>
        // 模拟必要的utils功能
        window.utils = window.utils || {};
        window.utils.log = function(message, level = 'info') {
            console[level === 'error' ? 'error' : level](message);
        };
        window.utils.setTimeout = window.setTimeout;
        window.utils.isObject = function(obj) {
            return obj !== null && typeof obj === 'object';
        };
    </script>
    <script src="modules/core/auth.js" defer></script>
    <script defer>
        // 注入一个简化版的moduleLoader，仅用于测试auth模块
        window.moduleLoader = {
            loadedModules: {},
            dependencies: {},
            markModuleLoaded: function(moduleName) {
                console.log(`模块加载器: ${moduleName} 标记为已加载`);
                this.loadedModules[moduleName] = true;
                window.testModuleLoaderEvents = window.testModuleLoaderEvents || [];
                window.testModuleLoaderEvents.push(`module_loaded:${moduleName}`);
            },
            getLoadingStatus: function() {
                const loaded = Object.keys(this.loadedModules);
                return {
                    total: 1,
                    loadedCount: loaded.length,
                    loaded: loaded,
                    pending: loaded.includes('auth') ? [] : ['auth']
                };
            }
        };
    </script>
    
    <script>
        // 日志记录函数
        function log(message) {
            const now = new Date().toLocaleTimeString();
            const logEntry = `${now}: ${message}\n`;
            document.getElementById('log-output').textContent += logEntry;
            console.log(message);
        }
        
        // 更新状态显示
        function updateStatus(elementId, status, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            
            // 移除所有状态类
            element.classList.remove('status-success', 'status-warning', 'status-error');
            
            // 添加相应状态类
            if (status === 'success') {
                element.classList.add('status-success');
            } else if (status === 'warning') {
                element.classList.add('status-warning');
            } else if (status === 'error') {
                element.classList.add('status-error');
            }
        }
        
        // 检查模块加载状态
        function checkModuleStatus() {
            log('开始检查模块加载状态...');
            
            try {
                // 检查auth模块
                const authExists = typeof window.auth !== 'undefined';
                const authInitialized = authExists && window.auth.isInitialized;
                log(`auth模块存在: ${authExists}, 是否已初始化: ${authInitialized}`);
                
                // 检查moduleLoader
                const loaderExists = typeof window.moduleLoader !== 'undefined';
                let authLoadedByLoader = false;
                if (loaderExists && window.moduleLoader.loadedModules) {
                    authLoadedByLoader = window.moduleLoader.loadedModules.auth;
                }
                log(`moduleLoader存在: ${loaderExists}, auth模块是否被加载器标记为已加载: ${authLoadedByLoader}`);
                
                // 检查全局初始化方法
                const initAuthMethodExists = typeof window.initAuthModule === 'function';
                log(`全局initAuthModule方法存在: ${initAuthMethodExists}`);
                
                // 综合状态评估
                if (authExists && authInitialized && authLoadedByLoader) {
                    updateStatus('module-status', 'success', '✅ 认证模块加载和初始化成功！');
                } else if (authExists && (authInitialized || authLoadedByLoader)) {
                    updateStatus('module-status', 'warning', '⚠️ 认证模块存在，但状态不一致，请检查控制台日志');
                } else if (authExists) {
                    updateStatus('module-status', 'warning', '⚠️ 认证模块存在，但未正确初始化');
                } else {
                    updateStatus('module-status', 'error', '❌ 认证模块不存在，请检查加载顺序');
                }
            } catch (error) {
                log(`检查过程中出错: ${error.message}`);
                updateStatus('module-status', 'error', `❌ 检查失败: ${error.message}`);
            }
        }
        
        // 测试认证模块功能
        function testAuthFunctionality() {
            log('开始测试认证模块功能...');
            
            try {
                if (!window.auth) {
                    throw new Error('auth模块未加载');
                }
                
                // 测试getCurrentUser方法
                const currentUser = window.auth.getCurrentUser();
                log(`当前用户: ${currentUser ? JSON.stringify(currentUser) : '未登录'}`);
                
                // 测试hasPermission方法（如果已登录）
                if (currentUser) {
                    const hasStudentPermission = window.auth.hasPermission('student');
                    log(`用户是否有student权限: ${hasStudentPermission}`);
                }
                
                // 测试会话检查功能
                const sessionExpired = window.auth.isSessionExpired();
                log(`会话是否过期: ${sessionExpired}`);
                
                updateStatus('auth-function-status', 'success', '✅ 认证模块功能测试通过！');
            } catch (error) {
                log(`测试过程中出错: ${error.message}`);
                updateStatus('auth-function-status', 'error', `❌ 功能测试失败: ${error.message}`);
            }
        }
        
        // 验证模块加载器
        function validateModuleLoader() {
            log('开始验证模块加载器...');
            
            try {
                if (!window.moduleLoader) {
                    throw new Error('moduleLoader未加载');
                }
                
                // 获取加载状态
                const status = window.moduleLoader.getLoadingStatus();
                log(`模块加载统计: 总计${status.total}个, 已加载${status.loadedCount}个, 未加载${status.pending.length}个`);
                log(`已加载模块: ${status.loaded.join(', ')}`);
                log(`未加载模块: ${status.pending.join(', ')}`);
                
                // 检查核心模块是否都已加载
                const coreModules = ['auth'];
                const allCoreLoaded = coreModules.every(module => status.loaded.includes(module));
                
                if (allCoreLoaded) {
                    updateStatus('loader-validation-status', 'success', '✅ 所有核心模块已成功加载！');
                } else {
                    updateStatus('loader-validation-status', 'error', `❌ 核心模块未完全加载，请检查: ${coreModules.filter(m => !status.loaded.includes(m)).join(', ')}`);
                }
            } catch (error) {
                log(`验证过程中出错: ${error.message}`);
                updateStatus('loader-validation-status', 'error', `❌ 加载器验证失败: ${error.message}`);
            }
        }
        
        // 页面加载完成后自动运行测试
        window.addEventListener('load', () => {
            log('页面加载完成，等待模块初始化...');
            
            // 延迟一段时间后运行测试，确保模块有足够时间初始化
            setTimeout(() => {
                log('开始自动测试...');
                checkModuleStatus();
                
                // 如果auth模块已加载，测试其功能
                if (window.auth && window.auth.isInitialized) {
                    testAuthFunctionality();
                }
                
                // 如果moduleLoader已加载，验证它
                if (window.moduleLoader) {
                    validateModuleLoader();
                }
            }, 1000);
        });
    </script>
</body>
</html>
