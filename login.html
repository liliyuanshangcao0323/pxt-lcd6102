<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生会管理系统 - 安全登录</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 360px;
            transition: box-shadow 0.3s ease;
        }
        .login-container:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
        }
        .login-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .login-btn:hover {
            background-color: #45a049;
        }
        .login-btn:active {
            transform: translateY(1px);
        }
        .login-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .error-message {
            color: #f44336;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 8px;
            background-color: #ffebee;
            border-radius: 4px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .forgot-password {
            text-align: center;
        }
        .forgot-password a {
            color: #2196F3;
            text-decoration: none;
            font-size: 14px;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .security-tip {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .form-group .input-wrapper {
            position: relative;
        }
        .form-group .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
        }
        .form-group .toggle-password:hover {
            color: #666;
        }
        .password-strength {
            margin-top: 5px;
            height: 4px;
            background-color: #eee;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .password-strength.show {
            display: block;
        }
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .password-strength-bar.weak {
            width: 33%;
            background-color: #f44336;
        }
        .password-strength-bar.medium {
            width: 66%;
            background-color: #ff9800;
        }
        .password-strength-bar.strong {
            width: 100%;
            background-color: #4CAF50;
        }
        .password-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            display: none;
        }
        .password-hint.show {
            display: block;
        }
        .login-attempts {
            font-size: 12px;
            color: #ff9800;
            text-align: right;
            margin-top: -15px;
            margin-bottom: 15px;
        }
        .lock-message {
            color: #f44336;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">学生会管理系统</h2>
        <div id="error-message" class="error-message"></div>
        <div id="lock-message" class="lock-message" style="display: none;"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <span class="toggle-password" id="toggle-password">👁️</span>
                </div>
                <div id="password-strength" class="password-strength">
                    <div id="password-strength-bar" class="password-strength-bar"></div>
                </div>
                <div id="password-hint" class="password-hint">
                    密码应包含字母和数字，长度至少8位
                </div>
            </div>
            <div id="login-attempts" class="login-attempts" style="display: none;"></div>
            <button type="submit" class="login-btn" id="login-button">登录</button>
        </form>
        <div class="forgot-password">
            <a href="javascript:void(0);" id="forgot-password">忘记密码？</a>
        </div>
        <div class="security-tip">
            <p>🔒 安全提示：请勿在公共电脑上记住密码</p>
            <p>💡 连续5次登录失败将导致账户锁定30分钟</p>
        </div>
    </div>

    <!-- 核心模块已在页面底部加载 -->
    <script>
        // 初始化登录页面
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const lockMessage = document.getElementById('lock-message');
            const loginButton = document.getElementById('login-button');
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const passwordStrength = document.getElementById('password-strength');
            const passwordStrengthBar = document.getElementById('password-strength-bar');
            const passwordHint = document.getElementById('password-hint');
            const loginAttempts = document.getElementById('login-attempts');
            
            // 显示/隐藏密码
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePassword.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
            });
            
            // 密码强度检测
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                
                if (password.length > 0) {
                    passwordStrength.classList.add('show');
                    passwordHint.classList.add('show');
                    
                    // 检测密码强度
                    const strength = securityModule.checkPasswordStrength(password);
                    
                    // 更新密码强度条
                    passwordStrengthBar.className = 'password-strength-bar';
                    if (strength === 'weak') {
                        passwordStrengthBar.classList.add('weak');
                    } else if (strength === 'medium') {
                        passwordStrengthBar.classList.add('medium');
                    } else if (strength === 'strong') {
                        passwordStrengthBar.classList.add('strong');
                    }
                } else {
                    passwordStrength.classList.remove('show');
                    passwordHint.classList.remove('show');
                }
            });
            
            // 检查是否有存储的登录失败信息
            function checkLoginAttempts(username) {
                const failedAttempts = localStorage.getItem(`failed_attempts_${username}`) || 0;
                const lastAttempt = localStorage.getItem(`last_attempt_${username}`);
                const lockUntil = localStorage.getItem(`lock_until_${username}`);
                
                // 检查账户是否被锁定
                if (lockUntil && new Date(lockUntil) > new Date()) {
                    const remainingMinutes = Math.ceil((new Date(lockUntil) - new Date()) / (1000 * 60));
                    lockMessage.textContent = `账户已被锁定，请${remainingMinutes}分钟后再试`;
                    lockMessage.style.display = 'block';
                    loginButton.disabled = true;
                    return false;
                } else if (lockUntil && new Date(lockUntil) <= new Date()) {
                    // 锁定时间已过，清除锁定信息
                    localStorage.removeItem(`lock_until_${username}`);
                    localStorage.setItem(`failed_attempts_${username}`, 0);
                }
                
                // 显示剩余尝试次数
                if (failedAttempts > 0) {
                    const remainingAttempts = 5 - parseInt(failedAttempts);
                    loginAttempts.textContent = `剩余尝试次数: ${remainingAttempts}`;
                    loginAttempts.style.display = 'block';
                } else {
                    loginAttempts.style.display = 'none';
                }
                
                return true;
            }
            
            // 用户名输入变化时检查状态
            document.getElementById('username').addEventListener('input', function() {
                lockMessage.style.display = 'none';
                loginButton.disabled = false;
                checkLoginAttempts(this.value);
            });
            
            // 处理登录提交
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 清除之前的错误
                errorMessage.classList.remove('show');
                errorMessage.textContent = '';
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // 验证输入
                if (!username || !password) {
                    errorMessage.textContent = '请输入用户名和密码';
                    errorMessage.classList.add('show');
                    return;
                }
                
                // 清理输入防止XSS
                const cleanUsername = securityModule.sanitizeInput(username);
                
                // 检查是否达到尝试限制
                if (!checkLoginAttempts(cleanUsername)) {
                    return;
                }
                
                // 禁用按钮防止重复提交
                loginButton.disabled = true;
                loginButton.textContent = '登录中...';
                
                // 尝试登录
                auth.login(cleanUsername, password)
                    .then(result => {
                        if (result.success) {
                            // 清除失败尝试记录
                            localStorage.removeItem(`failed_attempts_${cleanUsername}`);
                            localStorage.removeItem(`last_attempt_${cleanUsername}`);
                            
                            // 记录登录日志
                            securityModule.logSecurityEvent('login', {
                                username: cleanUsername,
                                timestamp: new Date().toISOString(),
                                success: true
                            });
                            
                            // 跳转到主页
                            window.location.href = 'index.html';
                        } else {
                            // 记录失败尝试
                            let failedAttempts = parseInt(localStorage.getItem(`failed_attempts_${cleanUsername}`) || 0) + 1;
                            localStorage.setItem(`failed_attempts_${cleanUsername}`, failedAttempts);
                            localStorage.setItem(`last_attempt_${cleanUsername}`, new Date().toISOString());
                            
                            // 检查是否需要锁定账户
                            if (failedAttempts >= 5) {
                                const lockUntil = new Date(Date.now() + 30 * 60 * 1000).toISOString(); // 锁定30分钟
                                localStorage.setItem(`lock_until_${cleanUsername}`, lockUntil);
                                lockMessage.textContent = '账户已被锁定，请30分钟后再试';
                                lockMessage.style.display = 'block';
                            } else {
                                const remainingAttempts = 5 - failedAttempts;
                                loginAttempts.textContent = `剩余尝试次数: ${remainingAttempts}`;
                                loginAttempts.style.display = 'block';
                            }
                            
                            // 显示错误消息
                            errorMessage.textContent = result.message || '用户名或密码错误';
                            errorMessage.classList.add('show');
                            
                            // 记录登录失败日志
                            securityModule.logSecurityEvent('login_failure', {
                                username: cleanUsername,
                                timestamp: new Date().toISOString(),
                                reason: result.message || 'invalid_credentials',
                                attempt: failedAttempts
                            });
                        }
                    })
                    .catch(error => {
                        console.error('登录错误:', error);
                        errorMessage.textContent = '登录过程中发生错误';
                        errorMessage.classList.add('show');
                    })
                    .finally(() => {
                        // 恢复按钮状态
                        loginButton.disabled = false;
                        loginButton.textContent = '登录';
                    });
            });
            
            // 忘记密码链接
            document.getElementById('forgot-password').addEventListener('click', function() {
                // 这里可以添加密码重置流程
                const username = document.getElementById('username').value;
                if (username) {
                    // 模拟发送重置请求
                    securityModule.logSecurityEvent('password_reset_request', {
                        username: securityModule.sanitizeInput(username),
                        timestamp: new Date().toISOString()
                    });
                    alert('密码重置请求已发送，请联系系统管理员或查看您的邮箱');
                } else {
                    alert('请先输入您的用户名');
                }
            });
        });
    </script>
    
    <!-- 登录页面需要的核心模块 -->
    <!-- 按照依赖关系顺序加载核心模块 -->
    <script src="modules/utils/utils.js"></script>
    <script src="modules/core/auth.js"></script>
    <script src="modules/core/securityModule.js"></script>
    <script src="modules/core/appData.js"></script>
    <script src="modules/features/notificationModule.js"></script>
    <!-- moduleLoader.js必须在其他模块之后引入 -->
    <script src="modules/core/moduleLoader.js"></script>
</body>
</html>
