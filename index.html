<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>贪吃蛇游戏</h1>
        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-info">
                <div class="score">得分: <span id="scoreValue">0</span></div>
                <div class="high-score">最高分: <span id="highScoreValue">0</span></div>
            </div>
        </div>
        <div class="controls">
            <button id="startBtn">开始游戏</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置游戏</button>
        </div>
        <div class="instructions">
            <h3>游戏说明</h3>
            <p>使用方向键控制蛇的移动，吃食物增加分数和长度。撞到墙壁或自己的身体游戏结束。</p>
            <p>在移动设备上，您可以滑动屏幕来控制方向。</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
