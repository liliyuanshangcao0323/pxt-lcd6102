<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>appData 测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        pre {
            background-color: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .pass {
            color: #4CAF50;
            font-weight: bold;
        }
        .fail {
            color: #f44336;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>appData 模块测试</h1>
        <p>此页面用于测试修复后的 appData.js 模块功能。</p>
        
        <!-- 模拟 utils 模块 -->
        <script>
            window.utils = {
                logger: {
                    info: function(msg) { console.log('[INFO]', msg); },
                    warn: function(msg) { console.log('[WARN]', msg); },
                    error: function(msg, err) { console.error('[ERROR]', msg, err); },
                    debug: function(msg) { console.debug('[DEBUG]', msg); }
                },
                storage: {
                    get: function(key) { 
                        try { 
                            return JSON.parse(localStorage.getItem(key));
                        } catch (e) {
                            console.error('Storage get error:', e);
                            return null;
                        }
                    },
                    set: function(key, value) { 
                        try {
                            localStorage.setItem(key, JSON.stringify(value));
                            return true;
                        } catch (e) {
                            console.error('Storage set error:', e);
                            return false;
                        }
                    }
                }
            };
            
            // 添加基础auth模块实现
            window.auth = {
                isInitialized: false,
                init: function() {
                    console.log('auth模块已初始化');
                    this.isInitialized = true;
                    return true;
                },
                login: function(username, password) {
                    console.log('模拟登录:', username);
                    return { success: false, message: '测试环境不支持实际登录' };
                },
                logout: function() {
                    console.log('模拟登出');
                    return true;
                },
                getCurrentUser: function() {
                    return null;
                }
            };
            
            // 全局初始化auth模块的方法
            window.initAuthModule = function() {
                if (window.auth && typeof window.auth.init === 'function') {
                    return window.auth.init();
                }
                return false;
            };
        </script>
        
        <!-- 加载 appData 模块 -->
        <script src="modules/core/appData.js"></script>
        
        <!-- 加载模块加载器 -->
        <script src="modules/core/moduleLoader.js"></script>
        
        <!-- 加载测试脚本 -->
        <script src="test_app_data.js"></script>
        
        <button class="btn" onclick="window.location.reload()">重新运行测试</button>
        
        <h2>测试结果输出</h2>
        <pre id="test-output"></pre>
    </div>
    
    <script>
        // 捕获控制台输出到页面
        (function() {
            var oldConsoleLog = console.log;
            var oldConsoleError = console.error;
            var oldConsoleDebug = console.debug;
            var oldConsoleWarn = console.warn;
            var outputDiv = document.getElementById('test-output');
            
            function appendToOutput(message, type) {
                if (typeof message === 'object') {
                    message = JSON.stringify(message, null, 2);
                }
                
                var formattedMessage = message.toString().replace(/\n/g, '<br>');
                
                if (type === 'error') {
                    formattedMessage = '<span class="fail">' + formattedMessage + '</span>';
                } else if (formattedMessage.includes('✅')) {
                    formattedMessage = '<span class="pass">' + formattedMessage + '</span>';
                } else if (formattedMessage.includes('❌')) {
                    formattedMessage = '<span class="fail">' + formattedMessage + '</span>';
                }
                
                outputDiv.innerHTML += formattedMessage + '<br>';
                outputDiv.scrollTop = outputDiv.scrollHeight;
            }
            
            console.log = function() {
                oldConsoleLog.apply(console, arguments);
                appendToOutput(Array.from(arguments).join(' '), 'log');
            };
            
            console.error = function() {
                oldConsoleError.apply(console, arguments);
                appendToOutput(Array.from(arguments).join(' '), 'error');
            };
            
            console.warn = function() {
                oldConsoleWarn.apply(console, arguments);
                appendToOutput(Array.from(arguments).join(' '), 'warn');
            };
            
            console.debug = function() {
                oldConsoleDebug.apply(console, arguments);
                appendToOutput(Array.from(arguments).join(' '), 'debug');
            };
        })();
        
        // 页面加载完成后提示
        window.onload = function() {
            console.log('页面加载完成，测试正在进行...');
        };
    </script>
</body>
</html>
